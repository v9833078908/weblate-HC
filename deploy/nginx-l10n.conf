#
# Host nginx vhost for the Weblate stack (hc-srv15-localizer already runs
# nginx on port 80 in front of the cathedral FastAPI app).
#
#   sudo cp deploy/nginx-l10n.conf /etc/nginx/sites-available/l10n
#   sudo ln -s /etc/nginx/sites-available/l10n /etc/nginx/sites-enabled/l10n
#   sudo nginx -t && sudo systemctl reload nginx
#
# The existing `fastapi` vhost is `default_server`, so this one only answers
# for the names listed below. The office IPs keep the site usable from inside
# the office network, where `l10n.herocraft.com` does not resolve.
#
# TLS is terminated by the edge proxy that publishes `l10n.herocraft.com`;
# it reaches this server over plain HTTP, so the scheme the browser used is
# only known from `X-Forwarded-Proto`. Pass that value through instead of
# overwriting it with `$scheme`, otherwise Weblate's HTTPS redirect loops.

map $http_x_forwarded_proto $l10n_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

log_format l10n '$remote_addr $host "$request" $status '
                'xfp=$http_x_forwarded_proto xff="$http_x_forwarded_for"';

server {
    listen 80;
    server_name l10n.herocraft.com 192.168.0.233 10.39.40.233;

    # Translation file uploads and repository pushes.
    client_max_body_size 200M;
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $l10n_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        access_log /var/log/nginx/l10n.log l10n;
    }
}
