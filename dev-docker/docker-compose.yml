services:
  cache:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    volumes:
    - redis-data:/data
    command: [redis-server, --save, '60', '1']
    restart: always
  database:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    volumes:
    - postgres-data:/var/lib/postgresql
    - ./postgres-init:/docker-entrypoint-initdb.d
    env_file:
    - ./environment
    ports:
    - 5434:5432
    restart: always
  maildev:
    image: maildev/maildev:2.2.1@sha256:180ef51f65eefebb0e7122d8308813c1fd7bff164bc440ce5a3c2feee167a810
    ports:
    - 1080:1080
  weblate:
    image: weblate-dev:latest
    build:
      context: ./weblate-dev/
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    depends_on:
    - cache
    - database
    - maildev
    volumes:
      # Local data directory
    - $PWD/data:/app/data   # Override Weblate with local dir
    - $PWD/..:/app/src
    environment:
      DJANGO_SETTINGS_MODULE: weblate.settings_docker
      WEBLATE_SITE_DOMAIN: ${WEBLATE_HOST}
      WEBLATE_REGISTRATION_OPEN: 0
      WEBLATE_ENABLE_SHARING: 0
      WEBLATE_CLARITY_PROJECT_ID: ${WEBLATE_CLARITY_PROJECT_ID:-}
      WEBLATE_EMAIL_HOST: maildev
      WEBLATE_EMAIL_PORT: 1025
      WEBLATE_EMAIL_USE_TLS: 0
      WEBLATE_EMAIL_USE_SSL: 0
      WEB_WORKERS: 1
      CELERY_TRANSLATE_OPTIONS: --concurrency 2 --prefetch-multiplier 1
      WEBLATE_VCS_ALLOW_SCHEMES: https,ssh,git,file,http
      WEBLATE_VCS_ALLOW_HOSTS: 192.168.0.3,corp.herocraft.com,83.219.159.2
      GRANIAN_ARGS: --reload --reload-paths /app/src/weblate
      WEBLATE_ADD_MACHINERY: weblate_customization.machinery.RoutedLLMTranslation,weblate_customization.machinery.RoutedLiteLLMTranslation
      WEBLATE_REMOVE_FORMATS: weblate.formats.ttkit.TS1Format,weblate.formats.ttkit.RichXliffFormat,weblate.formats.ttkit.Xliff2Format,weblate.formats.ttkit.RichXliff2Format,weblate.formats.ttkit.PoXliffFormat,weblate.formats.ttkit.AppleXliffFormat,weblate.formats.ttkit.JoomlaFormat,weblate.formats.ttkit.GWTFormat,weblate.formats.ttkit.PhpFormat,weblate.formats.ttkit.LaravelPhpFormat,weblate.formats.ttkit.MOKOFormat,weblate.formats.ttkit.CMPFormat,weblate.formats.ttkit.JSONNestedFormat,weblate.formats.ttkit.WebExtensionJSONFormat,weblate.formats.ttkit.I18NextFormat,weblate.formats.ttkit.CatkeysFormat,weblate.formats.ttkit.I18NextV4Format,weblate.formats.ttkit.GoI18JSONFormat,weblate.formats.ttkit.GoI18V2JSONFormat,weblate.formats.ttkit.GoTextFormat,weblate.formats.ttkit.ARBFormat,weblate.formats.ttkit.FormatJSFormat,weblate.formats.ttkit.CSVSimpleFormat,weblate.formats.ttkit.RubyYAMLFormat,weblate.formats.ttkit.SubRipFormat,weblate.formats.ttkit.MicroDVDFormat,weblate.formats.ttkit.AdvSubStationAlphaFormat,weblate.formats.ttkit.SubStationAlphaFormat,weblate.formats.ttkit.DTDFormat,weblate.formats.ttkit.FlatXMLFormat,weblate.formats.ttkit.ResourceDictionaryFormat,weblate.formats.ttkit.INIFormat,weblate.formats.ttkit.InnoSetupINIFormat,weblate.formats.ttkit.PropertiesMi18nFormat,weblate.formats.txt.AppStoreFormat,weblate.formats.convert.HTMLFormat,weblate.formats.convert.IDMLFormat,weblate.formats.convert.OpenDocumentFormat,weblate.formats.convert.DokuWikiFormat,weblate.formats.convert.MarkdownFormat,weblate.formats.convert.MDXFormat,weblate.formats.convert.MediaWikiFormat,weblate.formats.convert.WindowsRCFormat,weblate.formats.convert.AsciiDocFormat,weblate.formats.convert.WXLFormat,weblate.formats.ttkit.XWikiPropertiesFormat,weblate.formats.ttkit.XWikiPagePropertiesFormat,weblate.formats.ttkit.XWikiFullPageFormat,weblate.formats.ttkit.StringsdictFormat,weblate.formats.ttkit.FluentFormat,weblate.formats.ttkit.GoI18nTOMLFormat,weblate.formats.ttkit.TOMLFormat,weblate.formats.ttkit.RESJSONFormat,weblate.formats.ttkit.NextcloudJSONFormat,weblate.formats.multi.MultiCSVFormat
      WEBLATE_REMOVE_MACHINERY: weblate.machinery.apertium.ApertiumAPYTranslation,weblate.machinery.aws.AWSTranslation,weblate.machinery.alibaba.AlibabaTranslation,weblate.machinery.anthropic.AnthropicTranslation,weblate.machinery.baidu.BaiduTranslation,weblate.machinery.deepl.DeepLTranslation,weblate.machinery.glosbe.GlosbeTranslation,weblate.machinery.google.GoogleTranslation,weblate.machinery.googlev3.GoogleV3Translation,weblate.machinery.libretranslate.LTEngineTranslation,weblate.machinery.libretranslate.LibreTranslateTranslation,weblate.machinery.microsoft.MicrosoftCognitiveTranslation,weblate.machinery.modernmt.ModernMTTranslation,weblate.machinery.mymemory.MyMemoryTranslation,weblate.machinery.netease.NeteaseSightTranslation,weblate.machinery.tmserver.TMServerTranslation,weblate.machinery.yandex.YandexTranslation,weblate.machinery.yandexv2.YandexV2Translation,weblate.machinery.saptranslationhub.SAPTranslationHub,weblate.machinery.youdao.YoudaoTranslation,weblate.machinery.systran.SystranTranslation,weblate.machinery.openai.OpenAITranslation,weblate.machinery.mistral.MistralTranslation,weblate.machinery.ollama.OllamaTranslation,weblate.machinery.openai.AzureOpenAITranslation,weblate.machinery.cyrtranslit.CyrTranslitTranslation
      WEBLATE_ADD_CHECK: weblate_customization.checks.GameMarkupCheck,weblate_customization.checks.GameLineBreakCheck,weblate_customization.checks.CyrillicLeakCheck,weblate_customization.checks.GameNumberCheck,weblate_customization.checks.GameTokenCheck,weblate_customization.checks.GameLengthCheck,weblate_customization.checks.GameMaxLengthCheck,weblate_customization.checks.GameSourceMaxLengthCheck
      WEBLATE_REMOVE_CHECK: weblate.checks.chars.MaxLengthCheck,weblate.checks.source.SourceMaxLengthCheck,weblate.checks.consistency.TranslatedCheck
      WEBLATE_ADD_AUTOFIX: weblate_customization.autofixes.LineSeparatorSpacing,weblate_customization.autofixes.RemoveAddedFinalStop,weblate_customization.autofixes.AddFrenchPunctuationSpacing
      WEBLATE_JUDGE_ENABLED: 1
      WEBLATE_JUDGE_BASE_URL: https://hcbifrost.herocraft.com/litellm/v1
      WEBLATE_JUDGE_MODEL_SEAT_1: deepseek-v4-pro
      WEBLATE_JUDGE_MODEL_SEAT_2: atlas/qwen3.8-max
      WEBLATE_JUDGE_MAX_REPAIR_ATTEMPTS: 1
      WEBLATE_JUDGE_BATCH_SIZE: 5
      WEBLATE_JUDGE_REQUEST_DEADLINE: 120
      WEBLATE_JUDGE_REQUEST_IDLE_TIMEOUT: 30
      WEBLATE_JUDGE_TRANSPORT_RETRIES: 1
      WEBLATE_JUDGE_PROTOCOL_RETRIES: 1
      WEBLATE_JUDGE_TRANSIENT_HTTP_RETRIES: 1
      WEBLATE_JUDGE_MAX_UNPARSED_RETRY_ROUNDS: 1
      WEBLATE_JUDGE_RETRY_BUDGET_RATIO: 0.2
      WEBLATE_JUDGE_REASONING_EFFORT: ''
      WEBLATE_JUDGE_RESPONSE_FORMAT: json_schema
      WEBLATE_JUDGE_STREAM: 0
      WEBLATE_JUDGE_TEMPERATURE: 0
      WEBLATE_JUDGE_MAX_TOKENS: 0
      # Measured no-op: the proxy accepts a top-level `thinking` and drops it,
      # so seat 1 reported ~87% reasoning tokens while configured "off". The
      # `extra_body` shape does reach DeepSeek, but it costs recall (6 of 20
      # stored detections became `pass`), so seat 1 keeps its reasoning.
      WEBLATE_JUDGE_REASONING_EFFORT_SEAT_1: ''
      WEBLATE_JUDGE_RESPONSE_FORMAT_SEAT_1: json_schema
      WEBLATE_JUDGE_STREAM_SEAT_1: 'true'
      WEBLATE_JUDGE_BATCH_SIZE_SEAT_1: '2'
      WEBLATE_JUDGE_REQUEST_DEADLINE_SEAT_1: '120'
      WEBLATE_JUDGE_TEMPERATURE_SEAT_1: '0'
      WEBLATE_JUDGE_MAX_TOKENS_SEAT_1: '0'
      # `extra_body` is the only shape that reaches the AtlasCloud passthrough:
      # a top-level `enable_thinking` is rejected with HTTP 500 and a top-level
      # `thinking` is silently dropped. Measured on 16 paired requests: output
      # 945 -> 72 tokens, 34.8s -> 2.9s, reasoning share 92.1% -> 0%, 16/16
      # parsed, no clean string false-flagged, and two majors caught that the
      # thinking arm missed.
      # docs/llm-first/measurements/2026-09-03-judge-thinking-passthrough.md
      WEBLATE_JUDGE_REASONING_EFFORT_SEAT_2: extra_body.enable_thinking=false
      WEBLATE_JUDGE_RESPONSE_FORMAT_SEAT_2: json_schema
      WEBLATE_JUDGE_STREAM_SEAT_2: 'true'
      # Production measurement over 25 single-string requests: median 16.740s,
      # p95 100.594s and maximum 108.473s. The 150s deadline is the maximum
      # plus 25%, rounded up to the next 30s. Batch 1 keeps each tail request
      # from discarding another string's verdict.
      WEBLATE_JUDGE_BATCH_SIZE_SEAT_2: '1'
      WEBLATE_JUDGE_REQUEST_DEADLINE_SEAT_2: '150'
      WEBLATE_JUDGE_TEMPERATURE_SEAT_2: '0'
      WEBLATE_JUDGE_MAX_TOKENS_SEAT_2: '0'
      WEBLATE_JUDGE_DEFERRAL_ENABLED: 0
      WEBLATE_JUDGE_DEFERRAL_MIN_INTERVAL: 900
      WEBLATE_JUDGE_DEFERRAL_MAX_INTERVAL: 86400
      WEBLATE_JUDGE_DEFERRAL_SLOW_AFTER: 5
      WEBLATE_JUDGE_DEFERRAL_MAX_UNITS_PER_PASS: 200
      WEBLATE_JUDGE_DEFERRAL_CIRCUIT_FAILURE_THRESHOLD: 5
      WEBLATE_JUDGE_DEFERRAL_CIRCUIT_OPEN_SECONDS: 900
      WEBLATE_JUDGE_DEFERRAL_TOKEN_BUCKET_CAPACITY: 200
      WEBLATE_JUDGE_DEFERRAL_TOKEN_BUCKET_REFILL_PER_SECOND: 0.25
      WEBLATE_JUDGE_DEFERRAL_OPERATOR_STOPPED: 0
      WEBLATE_JUDGE_REQUEST_ATTEMPT_RETENTION_DAYS: 90
      WEBLATE_JUDGE_FALLBACK_BASE_URL: ''
      WEBLATE_JUDGE_FALLBACK_API_KEY: ''
      WEBLATE_JUDGE_FALLBACK_MODEL_SEAT_1: ''
      WEBLATE_JUDGE_FALLBACK_MODEL_SEAT_2: ''
      WEBLATE_JUDGE_FALLBACK_REASONING_EFFORT_SEAT_1: ''
      WEBLATE_JUDGE_FALLBACK_REASONING_EFFORT_SEAT_2: ''
      WEBLATE_JUDGE_FALLBACK_RESPONSE_FORMAT_SEAT_1: ''
      WEBLATE_JUDGE_FALLBACK_RESPONSE_FORMAT_SEAT_2: ''
      WEBLATE_LLM_USAGE_LOG_RETENTION_DAYS: 90
    env_file:
    - ./environment
    ports:
    - ${WEBLATE_PORT}:8080
    restart: always
    user: $USER_ID:$GROUP_ID
    tmpfs:
    - /app/cache:exec,uid=$USER_ID,gid=$GROUP_ID
    - /tmp:uid=$USER_ID,gid=$GROUP_ID,exec
    - /run:uid=$USER_ID,gid=$GROUP_ID
    userns_mode: host
volumes:
  weblate-data: {}
  postgres-data: {}
  redis-data: {}
